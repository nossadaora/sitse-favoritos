<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <style>
        /* Estilo geral da página */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 2rem;
        }

        header p {
            margin: 0;
        }

        /* Grade responsiva dos cinco sites */
        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 18px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        /* Cartão individual de cada site */
        .cartao {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.10);
            padding-bottom: 20px;
        }

        .cartao h2 {
            font-size: 1.25rem;
            margin: 20px 10px 14px;
        }

        .cartao img {
            width: 100%;
            height: 145px;
            object-fit: contain;
            padding: 15px;
            background: #eaf0ff;
        }

        .cartao a {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .cartao a:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #475569;
        }
    </style>
</head>
<body>
    <!-- Cabeçalho e título principal da página -->
    <header>
        <h1>Meus sites favoritos: Fellipe</h1>
        <p>Sites que eu gosto.</p>
    </header>

    <!-- Cada cartão contém o nome, a imagem e o link de um site -->
    <main>
        <section class="cartao">
            <h2>YouTube</h2>
            <!-- Imagem ilustrativa do YouTube -->
            <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="Logo do YouTube">
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">Visitar site</a>
        </section>

        <section class="cartao">
            <h2>Google</h2>
            <!-- Imagem ilustrativa do Google -->
            <img src="https://cdn.simpleicons.org/google/4285F4" alt="Logo do Google">
            <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">Visitar site</a>
        </section>

        <section class="cartao">
            <h2>Roblox</h2>
            <!-- Imagem ilustrativa do Roblox -->
            <img src="https://cdn.simpleicons.org/roblox/000000" alt="Logo do Roblox">
            <a href="https://www.roblox.com/" target="_blank" rel="noopener noreferrer">Visitar site</a>
        </section>

        <section class="cartao">
            <h2>GitHub</h2>
            <!-- Imagem ilustrativa do GitHub -->
            <img src="https://cdn.simpleicons.org/github/181717" alt="Logo do GitHub">
            <a href="https://github.com/" target="_blank" rel="noopener noreferrer">Visitar site</a>
        </section>

        <section class="cartao">
            <h2>Twitch</h2>
            <!-- Imagem ilustrativa da Twitch -->
            <img src="https://cdn.simpleicons.org/twitch/9146FF" alt="Logo da Twitch">
            <a href="https://www.twitch.tv/" target="_blank" rel="noopener noreferrer">Visitar site</a>
        </section>
    </main>

    <!-- Rodapé da página -->
    <footer>
        <p>Trabalho de HTML5 — Agenda 12 · Desenvolvimento de Sistemas I</p>
    </footer>
</body>
</html>
